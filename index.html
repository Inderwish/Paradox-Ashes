<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050709" />
  <title>悖论的灰烬 · 电影化三维叙事</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="world" aria-label="三维叙事场景"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="letterbox" aria-hidden="true"></div>

  <div id="boot" class="boot">
    <div class="boot-sigil" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="eyebrow">ASHES OF PARADOX / ARCHIVE 733</p>
    <h1>悖论的灰烬</h1>
    <p class="boot-copy">一座文明在最完美的瞬间，被自己的答案冻结。</p>
    <button id="enter" class="enter"><span>进入记忆</span><small>ENTER THE MEMORY</small></button>
    <p class="boot-hint">建议佩戴耳机 · 使用方向键切换章节</p>
  </div>

  <main id="experience" class="experience">
    <header class="topbar">
      <button id="brand" class="brand" aria-label="返回序章"><b>悖论</b><span>ASHES / 733</span></button>
      <div class="top-meta"><span id="location">ARCHIVE ROOT</span><i></i><span id="clock">00:00:00</span></div>
      <button id="sound" class="sound off" aria-label="切换声音"><span></span><span></span><span></span><small>SOUND</small></button>
    </header>

    <section class="story" id="story">
      <div class="chapter-mark"><span id="chapterNo">00</span><i></i><span id="chapterEn">PROLOGUE</span></div>
      <div class="copy" id="copy" aria-live="polite">
        <p class="kicker" id="kicker">ARCHIVE_ROOT</p>
        <h2 id="title">悖论的灰烬</h2>
        <p class="subtitle" id="subtitle">Ashes of Paradox</p>
        <blockquote id="quote">“这是一个关于 <em>#ERR_01</em> 的故事。”</blockquote>
        <p class="body" id="body">这个文明同时掌握了极致的效率与极致的浪漫，最终在自身的矛盾中迎来冻结。</p>
      </div>
      <button id="action" class="action hidden"><span>执行事件</span><i>↗</i></button>
    </section>

    <aside class="telemetry" aria-hidden="true">
      <div><span>COORD</span><b id="coord">X 00.0 / Z 00.0</b></div>
      <div><span>ATMOS</span><b id="atmos">STABLE</b></div>
      <div class="signal"><span>SIGNAL</span><i></i><i></i><i></i><i></i></div>
    </aside>

    <nav class="chapter-nav" aria-label="章节导航">
      <button id="prev" aria-label="上一章">←</button>
      <div id="rail" class="rail"></div>
      <button id="next" aria-label="下一章">→</button>
    </nav>

    <div id="transition" class="transition"><span></span><b></b></div>
    <div id="flash" class="flash"></div>
  </main>

  <div id="rotate" class="rotate">请横屏观看完整场景</div>
  <script>
    if (location.protocol === "file:") {
      document.addEventListener("DOMContentLoaded", () => {
        const button = document.getElementById("enter");
        if (button) {
          button.querySelector("span").textContent = "需要本地服务器";
          button.querySelector("small").textContent = "RUN: python3 -m http.server 4173";
          button.addEventListener("click", () => alert("ES 模块无法通过 file:// 直接运行。请在此目录运行 python3 -m http.server 4173，然后访问 http://localhost:4173。"), { once: false });
        }
      });
    }
  </script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
